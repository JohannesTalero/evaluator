name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: Gates (always)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tamano
        if: github.event_name == 'pull_request'
        run: python scripts/ci/tamano.py --base origin/${{ github.event.pull_request.base.ref }}

      - name: alcance
        if: github.event_name == 'pull_request'
        run: python scripts/ci/alcance.py --base origin/${{ github.event.pull_request.base.ref }}

      - name: plan
        run: |
          pip install pyyaml
          python scripts/plan.py validar

  api:
    name: API
    runs-on: ubuntu-latest
    if: hashFiles('api/pyproject.toml') != ''
    needs: gates
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4.3.0

      - name: Install and check
        working-directory: api
        run: |
          uv sync
          uv run ruff check .
          uv run pytest
          uv run bandit -r . -c pyproject.toml
          uv run pip-audit

  front:
    name: Front
    runs-on: ubuntu-latest
    if: hashFiles('front/package.json') != ''
    needs: gates
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      - name: Install and check
        working-directory: front
        run: |
          npm ci
          npm run lint
          npm run test
          npm audit

  infra:
    name: Infra
    runs-on: ubuntu-latest
    if: hashFiles('infra/**/*.tf') != ''
    needs: gates
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2

      - name: Check
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.2964.0
        with:
          directory: infra
          quiet: true

  tests:
    name: Support tests
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4.3.0

      - name: Run tests
        run: uv run --with pytest pytest tests/ -v
